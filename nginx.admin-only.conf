# Static private Admin container; no host ports. Gateway owns API access policy.
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /admin { return 301 /admin/; }
    location ^~ /admin/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /admin/index.html {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
    }
    location / { return 404; }
}
