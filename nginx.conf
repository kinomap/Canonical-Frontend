# KINOSOTA Nginx — Edge / Reverse Proxy for Control Plane
#
# CRITICAL ARCHITECTURE RULE:
#   Video traffic goes through Media Nginx (media-nginx:443 / :8090).
#   This Nginx is the Control Plane reverse proxy ONLY.
#
#   API traffic:   Browser → Nginx(:8888) → Backend(:8000)
#   Video traffic: Browser → Media Nginx(:8090/:443) → Media Worker(:8100)
#
# The /media/ location below serves only static assets (posters, backdrops),
# NOT video streams. Video streaming is handled by Media Nginx.
#
# Control Nginx MUST NOT proxy /stream/ — that is Media Plane.
#
# DNS RE-RESOLUTION:
#   Docker assigns new container IPs on every recreate. A literal hostname in
#   proxy_pass is resolved once at startup and cached — stale IPs cause 502.
#   Fix: use Docker's embedded resolver (127.0.0.11) + a $variable in proxy_pass
#   so Nginx re-queries DNS on every request, picking up the new IP automatically.
#   This mirrors the proven pattern in media-nginx.conf.

# Docker's embedded DNS server. valid=10s caps the re-resolution interval.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Variable-based proxy_pass forces per-request DNS re-resolution.
    # NEVER use a literal http://backend:... here — that caches the IP at startup.
    set $backend_upstream backend:8000;

    location /admin {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /usr/share/nginx/html/public;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ACME is control traffic over WireGuard; propagation can take >60 seconds.
    location ^~ /api/v1/internal/acme/ {
        allow 10.8.0.0/24;
        deny all;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_connect_timeout 5s;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static media assets ONLY (posters, backdrops) — NOT video streams.
    # Video streaming is handled by Media Nginx on port 8090 (dev) / 443 (prod).
    location /media/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
