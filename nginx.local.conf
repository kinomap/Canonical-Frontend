map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format no_query '$remote_addr $request_method $uri $status';
server {
    listen 80 default_server;
    server_name localhost;
    access_log /var/log/nginx/access.log no_query;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream backend:8000;
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /media/ { proxy_pass http://$backend_upstream; }
    location /admin/ {
        set $admin_dev admin-dev:5174;
        proxy_pass http://$admin_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
    location / {
        set $public_dev public-dev:5173;
        proxy_pass http://$public_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
