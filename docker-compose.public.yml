# VPS2 only. Does not change any existing localhost or combined deployment.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.public-frontend
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?Committed Frontend SHA is required}
    image: kinosota-public-frontend:${GIT_COMMIT_SHA:?Committed Frontend SHA is required}
    ports: ["80:80", "443:443"]
    volumes:
      - ${FRONTEND_RUNTIME_DIR:?Separate runtime state required}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_RUNTIME_DIR:?Separate runtime state required}/tls:/etc/kinosota-tls:ro
      - ${FRONTEND_RUNTIME_DIR:?Separate runtime state required}/certbot:/var/www/certbot:ro
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /tmp:noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
