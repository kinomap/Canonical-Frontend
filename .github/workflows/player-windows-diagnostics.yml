name: Player Windows source-test isolation
on:
  push:
    branches: ['feat/player-cloud-0.1.1']
    paths: ['.github/workflows/player-windows-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-player
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-openssl
      - name: Select CPython and native tools
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS_ROOT\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:pythonLocation | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:pythonLocation\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install source-test dependencies
        run: python -m pip install --disable-pip-version-check --timeout 30 -r requirements.txt pytest==8.3.5
      - name: Client and IPC unit tests
        timeout-minutes: 3
        run: python -u -m pytest -q tests/test_client.py
      - name: Package validation unit tests
        timeout-minutes: 3
        run: python -u -m pytest -q tests/test_packaging.py
      - name: Native HTTPS decoder tests
        timeout-minutes: 3
        run: python -u -m pytest -vv -s tests/test_real_mpv.py
      - name: Native Qt interface tests
        timeout-minutes: 3
        run: python -u -m pytest -q tests/test_ui.py
