<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>KINOSOTA — совместимый режим</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<!--
  KINOSOTA Lite TV portal (/tv/lite) for 2012–2017 Smart TVs (Samsung Orsay, early Tizen, LG Netcast / webOS 1–3,
  Android 4.4–7 boxes). Plain ES5 script, no ES modules, no backdrop-filter. See TV_MULTI_EPOCH_PORTAL_SPEC.md §4.
-->
<link rel="stylesheet" href="/assets/tv-lite.css?v=1">
</head>
<body>
<div id="lite-app" class="lite-app">
    <div class="lite-header">
        <span class="lite-brand">KINOSOTA</span>
        <span class="lite-badge">Совместимый режим</span>
    </div>
    <div id="lite-viewport" class="lite-viewport">
        <div id="lite-scroll" class="lite-scroll">
            <div id="lite-hero" class="lite-hero is-hidden"></div>
            <div id="lite-shelves"></div>
            <p id="lite-status" class="lite-status">Загружаем подборки…</p>
        </div>
    </div>

    <div id="lite-player" class="lite-player is-hidden">
        <video id="lite-video" class="lite-video" preload="auto"></video>
        <div id="lite-player-message" class="lite-player-message"></div>
        <div id="lite-player-bar" class="lite-player-bar">
            <div id="lite-player-title" class="lite-player-title"></div>
            <div class="lite-progress"><div id="lite-progress-fill" class="lite-progress-fill"></div></div>
            <div class="lite-player-row">
                <span id="lite-player-state" class="lite-player-state">▶</span>
                <span id="lite-player-time" class="lite-player-time">0:00 / 0:00</span>
                <span class="lite-player-hint">OK — пауза · ◀ ▶ — 30 сек · Назад — выход</span>
            </div>
        </div>
    </div>

    <div id="lite-exit" class="lite-exit is-hidden">
        <div class="lite-exit-box">
            <div class="lite-exit-title">Выйти из KINOSOTA?</div>
            <div class="lite-exit-buttons">
                <span id="lite-exit-leave" class="lite-btn">Выйти</span>
                <span id="lite-exit-stay" class="lite-btn">Остаться</span>
            </div>
        </div>
    </div>

    <div id="lite-toast" class="lite-toast is-hidden"></div>
</div>
<script src="/assets/tv-lite.js?v=1"></script>
</body>
</html>
