<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48 128x128 256x256" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KINOSOTA — фильмы, сериалы и новые истории. Найдите кино по жанру и рейтингу." />
    <title>KINOSOTA — фильмы и сериалы</title>
    <script>
      // Dual-Engine safety net (TV_MULTI_EPOCH_PORTAL_SPEC §2): legacy TVs (Orsay, Netcast,
      // webOS 1-4, Tizen 2-4, no ES modules / Proxy / CSS inset) automatically go to /tv/lite
      // without bothering the user. ?engine=nextgen keeps the full portal for this session.
      (function() {
        try {
          var path = window.location.pathname || '';
          if (path.indexOf('/tv') !== 0 || path.indexOf('/tv/lite') === 0) return;
          if ((window.location.search || '').indexOf('engine=nextgen') !== -1) {
            try { window.sessionStorage.setItem('kinosota:tv-engine', 'nextgen'); } catch (e) {}
            return;
          }
          try { if (window.sessionStorage.getItem('kinosota:tv-engine') === 'nextgen') return; } catch (e) {}
          var ua = (navigator.userAgent || '').toLowerCase();
          var appVer = (navigator.appVersion || '').toLowerCase();
          var isWebOs = ua.indexOf('webos') !== -1 || ua.indexOf('web0s') !== -1;
          var isTizen = ua.indexOf('tizen') !== -1;
          var isTvUa = isWebOs || isTizen || ua.indexOf('maple') !== -1 || appVer.indexOf('maple') !== -1 ||
                       ua.indexOf('smarthub') !== -1 || ua.indexOf('netcast') !== -1 ||
                       ua.indexOf('smarttv') !== -1 || ua.indexOf('smart-tv') !== -1 || ua.indexOf('hbbtv') !== -1 ||
                       ua.indexOf('aft') !== -1 || ua.indexOf('bravia') !== -1 || ua.indexOf('philips') !== -1 ||
                       ua.indexOf('android tv') !== -1 || ua.indexOf('googletv') !== -1 ||
                       typeof window.curWidget !== 'undefined' || typeof window.Common !== 'undefined';
          var legacyOrsay = ua.indexOf('maple') !== -1 || appVer.indexOf('maple') !== -1 ||
                            ua.indexOf('smarthub') !== -1 ||
                            typeof window.curWidget !== 'undefined' || typeof window.Common !== 'undefined' ||
                            (ua.indexOf('smarttv') !== -1 && !isTizen && !isWebOs) ||
                            (ua.indexOf('samsung') !== -1 && !isTizen &&
                             (ua.indexOf('2011') !== -1 || ua.indexOf('2012') !== -1 || ua.indexOf('2013') !== -1 || ua.indexOf('2014') !== -1 || ua.indexOf('2015') !== -1));
          var legacyTvOs = ua.indexOf('netcast') !== -1 || /web0?s\/[1-4]\./.test(ua) || /tizen[\s/]+[1-4]\./.test(ua);
          var chromeMatch = ua.match(/(?:chrome|crios|chromium)\/(\d+)/) || ua.match(/\b(\d{2,3})\.\d+\.\d+\.\d+\/[\d.]+\s+tv\b/);
          var chromeMajor = chromeMatch && chromeMatch[1] ? parseInt(chromeMatch[1], 10) : 0;
          var modules = 'noModule' in document.createElement('script');
          var hasProxy = typeof window.Proxy === 'function';
          var hasInset = !!(window.CSS && window.CSS.supports && window.CSS.supports('inset', '0px'));
          if (legacyOrsay || legacyTvOs || !modules || !hasProxy ||
              (chromeMajor && chromeMajor < 64) ||
              (isTvUa && ((chromeMajor && chromeMajor < 87) || !hasInset))) {
            window.location.replace('/tv/lite');
            return;
          }
          if (isTizen && !window.webapis) {
            try {
              var s = document.createElement('script');
              s.type = 'text/javascript';
              s.src = '$WEBAPIS/webapis/webapis.js';
              (document.head || document.documentElement).appendChild(s);
            } catch (err) {}
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          if (window.tizen && window.tizen.tvinputdevice) {
            window.tizen.tvinputdevice.registerKey('Return');
            window.tizen.tvinputdevice.registerKey('Exit');
          }
        } catch (e) {}

        var BACK_CODES = [4, 10009, 461, 196, 145, 27, 8];
        window.addEventListener('keydown', function(e) {
          var code = e.keyCode || e.which || 0;
          var key = (e.key || '').toLowerCase();
          var isBack = BACK_CODES.indexOf(code) !== -1 || key === 'back' || key === 'goback' || key === 'browserback' || key === 'escape' || key === 'backspace';
          if (isBack && window.location.pathname.indexOf('/tv') === 0) {
            setTimeout(function() {
              if (!e.defaultPrevented && !document.querySelector('.tv-exit')) {
                try { if (window.TVXInteractionPlugin && window.TVXInteractionPlugin.executeAction) { window.TVXInteractionPlugin.executeAction('back'); return; } } catch(x) {}
                try { if (window.history.length > 1) { window.history.back(); return; } } catch(x) {}
                try { window.location.replace('http://www.kinosota.devs.surf/'); return; } catch(x) {}
                window.location.href = 'http://www.kinosota.devs.surf/';
              }
            }, 120);
          }
        }, false);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
