<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48 128x128 256x256" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KINOSOTA — фильмы, сериалы и новые истории. Найдите кино по жанру и рейтингу." />
    <title>KINOSOTA — фильмы и сериалы</title>
    <script>
      // Dual-Engine safety net (TV_MULTI_EPOCH_PORTAL_SPEC §2): a 2012–2017 TV that opens /tv directly
      // (Orsay / Netcast, or no ES modules) goes to the ES5 Lite portal instead of a dark empty screen.
      // ?engine=nextgen (Launcher «Next-Gen» mode) keeps the full portal for this tab session.
      (function() {
        try {
          var path = window.location.pathname || '';
          if (path.indexOf('/tv') !== 0 || path.indexOf('/tv/lite') === 0) return;
          if ((window.location.search || '').indexOf('engine=nextgen') !== -1) {
            try { window.sessionStorage.setItem('kinosota:tv-engine', 'nextgen'); } catch (e) {}
            return;
          }
          try { if (window.sessionStorage.getItem('kinosota:tv-engine') === 'nextgen') return; } catch (e) {}
          var ua = (navigator.userAgent || '').toLowerCase();
          var legacyUa = ua.indexOf('maple') !== -1 || ua.indexOf('netcast') !== -1;
          var modules = 'noModule' in document.createElement('script');
          if (legacyUa || !modules) window.location.replace('/tv/lite');
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          if (window.tizen && window.tizen.tvinputdevice) {
            window.tizen.tvinputdevice.registerKey('Return');
            window.tizen.tvinputdevice.registerKey('Exit');
          }
        } catch (e) {}

        var BACK_CODES = [4, 10009, 461, 196, 145, 27, 8];
        window.addEventListener('keydown', function(e) {
          var code = e.keyCode || e.which || 0;
          var key = (e.key || '').toLowerCase();
          var isBack = BACK_CODES.indexOf(code) !== -1 || key === 'back' || key === 'goback' || key === 'browserback' || key === 'escape' || key === 'backspace';
          if (isBack && window.location.pathname.indexOf('/tv') === 0) {
            setTimeout(function() {
              if (!e.defaultPrevented && !document.querySelector('.tv-exit')) {
                try { if (window.TVXInteractionPlugin && window.TVXInteractionPlugin.executeAction) { window.TVXInteractionPlugin.executeAction('back'); return; } } catch(x) {}
                try { if (window.history.length > 1) { window.history.back(); return; } } catch(x) {}
                try { window.location.replace('http://www.kinosota.devs.surf/'); return; } catch(x) {}
                window.location.href = 'http://www.kinosota.devs.surf/';
              }
            }, 120);
          }
        }, false);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
