services:
  public-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c 'npm ci && npm run dev -- --host 0.0.0.0'
    volumes: ["./frontend:/app", "public_modules:/app/node_modules"]
    ports: ["127.0.0.1:5173:5173"]
  admin-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c 'npm ci && npm run dev -- --host 0.0.0.0'
    volumes: ["./admin-frontend:/app", "admin_modules:/app/node_modules"]
    ports: ["127.0.0.1:5174:5174"]
volumes:
  public_modules:
  admin_modules:
